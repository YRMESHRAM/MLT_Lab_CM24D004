<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MobileNet Classifier</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* HEADER */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
}
.logo { font-size:1rem; font-weight:600; letter-spacing:0.5px; }
.logo span { color:#fff; opacity:0.35; font-weight:400; }
.header-right { display:flex; align-items:center; gap:12px; }
.status { display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:#444; }
.dot { width:6px; height:6px; border-radius:50%; background:#222; transition:all 0.3s; }
.dot.live { background:#4ade80; box-shadow:0 0 6px #4ade80; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

#cam-btn {
  padding:7px 18px;
  background:#fff; color:#000;
  border:none; border-radius:6px;
  font-family:'Inter',sans-serif; font-size:0.78rem; font-weight:600;
  cursor:pointer; transition:all 0.15s;
}
#cam-btn:hover { background:#ddd; }
#cam-btn:disabled { background:#1a1a1a; color:#444; cursor:not-allowed; }
#cam-btn.off { background:#000; color:#ef4444; border:1px solid #2a2a2a; }
#cam-btn.off:hover { background:#1a0000; }

/* LAYOUT */
.layout {
  flex:1; display:grid;
  grid-template-columns:1fr 320px;
  overflow:hidden;
}

/* VIDEO */
.video-wrap {
  position:relative; background:#000;
  display:flex; align-items:center; justify-content:center;
  border-right:1px solid #1a1a1a;
}
video { width:640px; height:480px; display:block; }

/* Top-1 label overlay on video */
#top-label {
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.75);
  border:1px solid #2a2a2a;
  border-radius:8px;
  padding:8px 20px;
  font-family:'JetBrains Mono',monospace;
  font-size:0.85rem; color:#fff;
  letter-spacing:0.5px;
  white-space:nowrap;
  pointer-events:none;
  opacity:0; transition:opacity 0.2s;
}
#top-label.visible { opacity:1; }

#fps-tag {
  position:absolute; top:12px; right:12px;
  font-family:'JetBrains Mono',monospace; font-size:0.62rem; color:#333;
  background:rgba(0,0,0,0.6); padding:3px 8px; border-radius:4px;
  pointer-events:none;
}

/* idle overlay */
#idle {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  background:#000; transition:opacity 0.3s; z-index:10;
}
#idle.hidden { opacity:0; pointer-events:none; }
#idle-msg { font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:#444; letter-spacing:2px; }
.spinner { width:24px; height:24px; border:2px solid #1a1a1a; border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
.spinner.hide { display:none; }
@keyframes spin { to{ transform:rotate(360deg); } }

/* SIDEBAR */
.sidebar { background:#000; display:flex; flex-direction:column; overflow:hidden; }

.panel { border-bottom:1px solid #1a1a1a; padding:14px 16px; }
.panel-title { font-family:'JetBrains Mono',monospace; font-size:0.58rem; color:#444; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }

/* STATS */
.stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.stat { background:#0a0a0a; border:1px solid #1a1a1a; border-radius:6px; padding:10px 10px; text-align:center; }
.stat-n { font-family:'JetBrains Mono',monospace; font-size:1.3rem; color:#fff; line-height:1; }
.stat-l { font-size:0.58rem; color:#444; margin-top:4px; letter-spacing:1px; }

/* TOP PREDICTIONS */
.pred-list { flex:1; overflow-y:auto; padding:12px 16px; scrollbar-width:thin; scrollbar-color:#1a1a1a #000; }
.pred-item {
  padding:10px 0;
  border-bottom:1px solid #0f0f0f;
  animation:fadeIn 0.15s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:none} }
.pred-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.pred-name { font-size:0.8rem; font-weight:500; color:#ccc; text-transform:capitalize; }
.pred-pct { font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:#666; }
.pred-bar { height:2px; background:#111; border-radius:1px; }
.pred-fill { height:100%; border-radius:1px; background:#fff; transition:width 0.25s; }
/* rank coloring */
.pred-item:nth-child(1) .pred-name { color:#fff; }
.pred-item:nth-child(1) .pred-fill { background:#fff; }
.pred-item:nth-child(1) .pred-pct  { color:#fff; }
.pred-item:nth-child(2) .pred-fill { background:#888; }
.pred-item:nth-child(3) .pred-fill { background:#555; }

.empty { font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:#333; text-align:center; padding:28px 0; }

/* LOG */
.log { border-top:1px solid #1a1a1a; padding:8px 16px; max-height:80px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#1a1a1a #000; flex-shrink:0; }
.log-row { font-family:'JetBrains Mono',monospace; font-size:0.6rem; color:#333; padding:1px 0; }
.log-row b { color:#555; }
</style>
</head>
<body>

<header>
  <div class="logo">mobile<span>net</span></div>
  <div class="header-right">
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-txt">loading model</span>
    </div>
    <button id="cam-btn" disabled>Enable Camera</button>
  </div>
</header>

<div class="layout">

  <!-- VIDEO -->
  <div class="video-wrap">
    <video id="video" autoplay muted playsinline></video>
    <div id="top-label">—</div>
    <div class="fps-tag" id="fps-tag">— fps</div>

    <div id="idle">
      <div class="spinner" id="spinner"></div>
      <div id="idle-msg">LOADING MODEL</div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="panel">
      <div class="panel-title">Stats</div>
      <div class="stats">
        <div class="stat"><div class="stat-n" id="s-fps">0</div><div class="stat-l">FPS</div></div>
        <div class="stat"><div class="stat-n" id="s-inf">0</div><div class="stat-l">INF MS</div></div>
      </div>
    </div>

    <div class="panel" style="padding-bottom:6px;">
      <div class="panel-title">Top Predictions</div>
    </div>
    <div class="pred-list" id="pred-list">
      <div class="empty">no signal</div>
    </div>

    <div class="log" id="log"></div>
  </div>

</div>

<script>
const video     = document.getElementById('video');
const camBtn    = document.getElementById('cam-btn');
const dot       = document.getElementById('dot');
const statusTxt = document.getElementById('status-txt');
const idle      = document.getElementById('idle');
const idleMsg   = document.getElementById('idle-msg');
const spinner   = document.getElementById('spinner');
const fpsTg     = document.getElementById('fps-tag');
const topLabel  = document.getElementById('top-label');
const predList  = document.getElementById('pred-list');
const logEl     = document.getElementById('log');

let model = null, stream = null, running = false, rafId = null;
let fpsCount = 0, fpsLast = performance.now(), fps = 0;

// Load MobileNet
mobilenet.load().then(m => {
  model = m;
  spinner.classList.add('hide');
  idleMsg.textContent = 'CAMERA OFF';
  statusTxt.textContent = 'ready';
  camBtn.disabled = false;
  addLog('MobileNet loaded');
}).catch(() => {
  idleMsg.textContent = 'MODEL LOAD FAILED';
  statusTxt.textContent = 'error';
});

// Toggle camera
camBtn.addEventListener('click', () => running ? stopCam() : startCam());

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width:640, height:480 } });
    video.srcObject = stream;
    video.onloadeddata = () => {
      running = true;
      idle.classList.add('hidden');
      dot.classList.add('live');
      statusTxt.textContent = 'live';
      camBtn.textContent = 'Disable Camera';
      camBtn.classList.add('off');
      topLabel.classList.add('visible');
      addLog('Camera enabled');
      classifyLoop();
    };
  } catch(e) {
    idleMsg.textContent = 'ACCESS DENIED';
    addLog('Camera access denied');
  }
}

function stopCam() {
  running = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  idle.classList.remove('hidden');
  idleMsg.textContent = 'CAMERA OFF';
  dot.classList.remove('live');
  statusTxt.textContent = 'standby';
  camBtn.textContent = 'Enable Camera';
  camBtn.classList.remove('off');
  topLabel.classList.remove('visible');
  predList.innerHTML = '<div class="empty">no signal</div>';
  document.getElementById('s-fps').textContent = '0';
  document.getElementById('s-inf').textContent = '0';
  fpsTg.textContent = '— fps';
  addLog('Camera disabled');
}

// Classification loop
async function classifyLoop() {
  if (!running) return;

  const t0 = performance.now();
  // classify returns top-3 predictions: [{className, probability}]
  const preds = await model.classify(video, 5);
  const inferMs = Math.round(performance.now() - t0);

  // FPS
  fpsCount++;
  const now = performance.now();
  if (now - fpsLast > 700) {
    fps = Math.round(fpsCount / ((now - fpsLast) / 1000));
    fpsCount = 0; fpsLast = now;
    fpsTg.textContent = `${fps} fps`;
    document.getElementById('s-fps').textContent = fps;
  }
  document.getElementById('s-inf').textContent = inferMs;

  updatePredictions(preds);
  rafId = requestAnimationFrame(classifyLoop);
}

let lastTop = '';
function updatePredictions(preds) {
  if (!preds || !preds.length) return;

  // Top label overlay on video — clean up className (MobileNet returns comma-separated synonyms)
  const top = preds[0].className.split(',')[0].trim();
  topLabel.textContent = `${top}  ${Math.round(preds[0].probability * 100)}%`;

  // Sidebar list
  predList.innerHTML = preds.map((p, i) => {
    const name  = p.className.split(',')[0].trim();
    const pct   = Math.round(p.probability * 100);
    return `<div class="pred-item">
      <div class="pred-top">
        <span class="pred-name">${i === 0 ? '▸ ' : ''}${name}</span>
        <span class="pred-pct">${pct}%</span>
      </div>
      <div class="pred-bar">
        <div class="pred-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
  }).join('');

  // Log when top class changes
  if (top !== lastTop) {
    lastTop = top;
    addLog(`Classified: ${top} (${Math.round(preds[0].probability * 100)}%)`);
  }
}

function addLog(msg) {
  const t = new Date();
  const ts = [t.getHours(), t.getMinutes(), t.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
  const row = document.createElement('div');
  row.className = 'log-row';
  row.innerHTML = `<b>[${ts}]</b> ${msg}`;
  logEl.prepend(row);
  while (logEl.children.length > 15) logEl.removeChild(logEl.lastChild);
}
</script>
</body>
</html>
