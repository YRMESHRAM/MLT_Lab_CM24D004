<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pose Position Detector</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0f0f0f;
  font-family: 'Inter', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px 16px 48px;
  color: #fff;
}

h1 { font-size: 1.2rem; font-weight: 700; color: #fff; }
.sub { font-size: .75rem; color: #444; margin-top: 2px; margin-bottom: 18px; }

/* ── Video wrapper ── */
.video-wrap {
  position: relative;
  width: 100%;
  max-width: 640px;
  aspect-ratio: 4/3;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,.7);
}

#canvas-container canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/* Off screen */
#off-screen {
  position: absolute; inset: 0;
  background: #0a0a0a;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; color: #2a2a2a;
}
#off-screen svg { opacity: .3; }
#off-screen p { font-size: .8rem; color: #333; }

/* Loading */
#load-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.85);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; z-index: 30;
}
#load-overlay.show { display: flex; }
.spinner {
  width: 30px; height: 30px;
  border: 2.5px solid rgba(255,255,255,.1);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#load-overlay p { font-size: .75rem; color: #666; }

/* ════════════════════════════════════════
   REAL-TIME PANEL — top right on video
   ════════════════════════════════════════ */
#rt-panel {
  position: absolute;
  top: 10px; right: 10px;
  width: 160px;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px;
  padding: 11px 12px;
  z-index: 20;
  display: none;
  flex-direction: column;
  gap: 9px;
}
#rt-panel.show { display: flex; }

/* Header */
.rt-head {
  display: flex; align-items: center; gap: 6px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4ade80; flex-shrink: 0;
  box-shadow: 0 0 5px #4ade80;
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.2} }
.rt-head span { font-size: .58rem; font-weight: 600; color: #444; letter-spacing: .1em; text-transform: uppercase; }

/* Current position — big */
.rt-current {
  display: flex; align-items: center; gap: 9px;
}
.rt-emoji { font-size: 1.8rem; line-height: 1; }
.rt-info {}
.rt-name { font-size: .9rem; font-weight: 700; line-height: 1.1; }
.rt-conf { font-size: .6rem; color: #555; margin-top: 2px; }
.rt-conf span { font-weight: 600; }

/* Divider */
.rt-div { height: 1px; background: rgba(255,255,255,.07); }

/* All positions mini scores */
.rt-rows { display: flex; flex-direction: column; gap: 6px; }

.rt-row {
  display: grid;
  grid-template-columns: 18px 1fr 30px;
  align-items: center;
  gap: 5px;
  opacity: .4;
  transition: opacity .2s;
}
.rt-row.winner { opacity: 1; }

.rt-row-icon { font-size: .78rem; text-align: center; }
.rt-row-bar-wrap { height: 3px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; }
.rt-row-bar { height: 100%; border-radius: 2px; transition: width .2s ease; }
.rt-row-pct { font-size: .58rem; text-align: right; font-weight: 600; color: #555; }
.rt-row.winner .rt-row-pct { color: #fff; }

/* ── Controls ── */
.controls {
  width: 100%; max-width: 640px;
  margin-top: 12px;
  display: flex; flex-direction: column; gap: 10px;
}

#cam-btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  font-size: .95rem; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  transition: all .2s;
}
#cam-btn:active { transform: scale(.98); }
#cam-btn.start { background: #22c55e; color: #fff; }
#cam-btn.stop  { background: #ef4444; color: #fff; }

/* Debug card — shows raw angles */
.card {
  background: #1a1a1a;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 14px 16px;
}
.card h3 { font-size: .65rem; font-weight: 600; color: #444; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }

/* angle debug grid */
#angle-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.angle-cell {
  background: #111;
  border-radius: 8px;
  padding: 9px 11px;
}
.angle-cell .a-label { font-size: .62rem; color: #444; margin-bottom: 3px; }
.angle-cell .a-val   { font-size: 1rem; font-weight: 700; color: #fff; }
.angle-cell .a-bar-wrap { height: 3px; background: #222; border-radius: 2px; margin-top: 5px; overflow: hidden; }
.angle-cell .a-bar { height: 100%; border-radius: 2px; background: #4ade80; transition: width .2s; }

/* history */
#hist { display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto; margin-top: 10px; border-top: 1px solid #222; padding-top: 10px; }
#hist::-webkit-scrollbar { width: 2px; }
#hist::-webkit-scrollbar-thumb { background: #333; }
.h-row {
  display: flex; align-items: center; gap: 8px;
  font-size: .75rem; padding: 5px 8px;
  background: #111; border-radius: 7px;
  animation: fadeUp .2s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:none} }
.h-name { flex: 1; font-weight: 600; }
.h-time { font-size: .62rem; color: #444; }
.no-h { font-size: .72rem; color: #333; text-align: center; padding: 8px 0; }
</style>
</head>
<body>

<h1>🧍 Pose Position Detector</h1>
<p class="sub">Angle-based detection · standing · sitting · lying · bending</p>

<!-- Video -->
<div class="video-wrap">
  <div id="off-screen">
    <svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
    </svg>
    <p>Camera is off</p>
  </div>

  <div id="canvas-container"></div>

  <div id="load-overlay">
    <div class="spinner"></div>
    <p id="load-msg">Starting…</p>
  </div>

  <!-- ══ REAL-TIME PANEL top-right ══ -->
  <div id="rt-panel">
    <div class="rt-head">
      <div class="live-dot"></div>
      <span>Live Prediction</span>
    </div>

    <div class="rt-current">
      <div class="rt-emoji" id="rt-emoji">❓</div>
      <div class="rt-info">
        <div class="rt-name"  id="rt-name">—</div>
        <div class="rt-conf">Score <span id="rt-conf">0%</span></div>
      </div>
    </div>

    <div class="rt-div"></div>

    <div class="rt-rows">
      <div class="rt-row" id="row-standing">
        <span class="rt-row-icon">🧍</span>
        <div class="rt-row-bar-wrap"><div class="rt-row-bar" id="bar-standing" style="width:0%;background:#4ade80"></div></div>
        <span class="rt-row-pct" id="pct-standing">0%</span>
      </div>
      <div class="rt-row" id="row-sitting">
        <span class="rt-row-icon">🪑</span>
        <div class="rt-row-bar-wrap"><div class="rt-row-bar" id="bar-sitting"  style="width:0%;background:#60a5fa"></div></div>
        <span class="rt-row-pct" id="pct-sitting">0%</span>
      </div>
      <div class="rt-row" id="row-lying">
        <span class="rt-row-icon">🛌</span>
        <div class="rt-row-bar-wrap"><div class="rt-row-bar" id="bar-lying"    style="width:0%;background:#fbbf24"></div></div>
        <span class="rt-row-pct" id="pct-lying">0%</span>
      </div>
      <div class="rt-row" id="row-bending">
        <span class="rt-row-icon">🤸</span>
        <div class="rt-row-bar-wrap"><div class="rt-row-bar" id="bar-bending"  style="width:0%;background:#c084fc"></div></div>
        <span class="rt-row-pct" id="pct-bending">0%</span>
      </div>
    </div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <button id="cam-btn" class="start" onclick="toggleCam()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
    </svg>
    <span id="btn-lbl">Enable Camera</span>
  </button>

  <div class="card">
    <h3>📐 Joint Angles (Debug)</h3>
    <div id="angle-grid">
      <div class="angle-cell">
        <div class="a-label">Torso Angle</div>
        <div class="a-val" id="a-torso">—</div>
        <div class="a-bar-wrap"><div class="a-bar" id="ab-torso" style="width:0%;background:#4ade80"></div></div>
      </div>
      <div class="angle-cell">
        <div class="a-label">Hip–Knee Angle</div>
        <div class="a-val" id="a-hip">—</div>
        <div class="a-bar-wrap"><div class="a-bar" id="ab-hip" style="width:0%;background:#60a5fa"></div></div>
      </div>
      <div class="angle-cell">
        <div class="a-label">Knee–Ankle Angle</div>
        <div class="a-val" id="a-knee">—</div>
        <div class="a-bar-wrap"><div class="a-bar" id="ab-knee" style="width:0%;background:#fbbf24"></div></div>
      </div>
      <div class="angle-cell">
        <div class="a-label">Body Aspect Ratio</div>
        <div class="a-val" id="a-ratio">—</div>
        <div class="a-bar-wrap"><div class="a-bar" id="ab-ratio" style="width:0%;background:#c084fc"></div></div>
      </div>
    </div>

    <div id="hist"><div class="no-h">No detections yet</div></div>
  </div>
</div>

<script>
// ── Skeleton links ─────────────────────────────────────
const LINKS = [
  ['leftShoulder','rightShoulder'],
  ['leftShoulder','leftElbow'],['rightShoulder','rightElbow'],
  ['leftElbow','leftWrist'],['rightElbow','rightWrist'],
  ['leftShoulder','leftHip'],['rightShoulder','rightHip'],
  ['leftHip','rightHip'],
  ['leftHip','leftKnee'],['rightHip','rightKnee'],
  ['leftKnee','leftAnkle'],['rightKnee','rightAnkle'],
];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ANGLE HELPERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// Angle (degrees) of vector from pointA → pointB  (0° = right, 90° = down)
function vecAngle(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}

// Angle at joint B, formed by A–B–C  (0–180°)
function jointAngle(a, b, c) {
  const ab = { x: a.x - b.x, y: a.y - b.y };
  const cb = { x: c.x - b.x, y: c.y - b.y };
  const dot = ab.x*cb.x + ab.y*cb.y;
  const mag = Math.sqrt(ab.x**2+ab.y**2) * Math.sqrt(cb.x**2+cb.y**2);
  if (mag < 1e-6) return 180;
  return Math.acos(Math.min(1, Math.max(-1, dot/mag))) * 180 / Math.PI;
}

// Safe keypoint getter
function kp(pose, name, minConf = 0.3) {
  const k = pose.keypoints.find(p => p.part === name);
  return (k && k.score >= minConf) ? k.position : null;
}

function avgPt(...pts) {
  const v = pts.filter(Boolean);
  if (!v.length) return null;
  return { x: v.reduce((s,p)=>s+p.x,0)/v.length, y: v.reduce((s,p)=>s+p.y,0)/v.length };
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CORE DETECTION  — angle-based
// Returns { standing, sitting, lying, bending } scores 0-100
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function classify(pose) {
  const ls = kp(pose,'leftShoulder');
  const rs = kp(pose,'rightShoulder');
  const lh = kp(pose,'leftHip');
  const rh = kp(pose,'rightHip');
  const lk = kp(pose,'leftKnee');
  const rk = kp(pose,'rightKnee');
  const la = kp(pose,'leftAnkle');
  const ra = kp(pose,'rightAnkle');
  const no = kp(pose,'nose', 0.2);

  const shoulder = avgPt(ls, rs);
  const hip      = avgPt(lh, rh);
  const knee     = avgPt(lk, rk);
  const ankle    = avgPt(la, ra);

  const angles = {};

  // ── 1. TORSO ANGLE  (shoulder → hip vs vertical)
  // Vertical = 90°  → person is upright
  // Near 0° or 180° → person is horizontal (lying)
  if (shoulder && hip) {
    const raw = vecAngle(shoulder, hip); // angle from shoulder down to hip
    // Convert to "how vertical is the torso" (0=horizontal, 90=vertical)
    angles.torso = Math.abs(Math.abs(raw) - 90); // 0=vertical, 90=horizontal
  }

  // ── 2. HIP ANGLE  (shoulder–hip–knee)
  // Standing: ~170-180° (straight line)
  // Sitting:  ~80-100°  (bent at hip)
  if (shoulder && hip && knee) {
    angles.hipAngle = jointAngle(shoulder, hip, knee);
  }

  // ── 3. KNEE ANGLE  (hip–knee–ankle)
  // Standing: ~170-180° (straight leg)
  // Sitting:  ~80-100°  (bent knee)
  if (hip && knee && ankle) {
    angles.kneeAngle = jointAngle(hip, knee, ankle);
  }

  // ── 4. BODY BOUNDING BOX ASPECT RATIO
  // Collect all visible keypoints
  const pts = pose.keypoints.filter(k => k.score > 0.25).map(k => k.position);
  if (pts.length >= 3) {
    const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
    const w = Math.max(...xs) - Math.min(...xs);
    const h = Math.max(...ys) - Math.min(...ys);
    // ratio = height/width  → tall = standing/sitting, wide = lying
    angles.aspectRatio = h / (w + 1);
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // DECISION RULES  — priority order
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  let scores = { standing:0, sitting:0, lying:0, bending:0 };

  // ── LYING: torso is near-horizontal OR aspect ratio is wide
  const torsoH = (angles.torso !== undefined) ? angles.torso > 55 : false;
  const bodyWide = (angles.aspectRatio !== undefined) ? angles.aspectRatio < 0.55 : false;
  if (torsoH || bodyWide) {
    scores.lying = torsoH && bodyWide ? 95 : torsoH ? 80 : 70;
    scores.standing = 5; scores.sitting = 10; scores.bending = 5;
    return { scores, angles };
  }

  // ── BENDING: torso angle is moderate (20-55°) — person is leaning forward
  const torsoBend = (angles.torso !== undefined) ? (angles.torso > 20 && angles.torso <= 55) : false;
  if (torsoBend) {
    const bendStrength = Math.round(((angles.torso - 20) / 35) * 80) + 15;
    scores.bending = bendStrength;
    scores.standing = Math.max(0, 60 - bendStrength);
    scores.sitting  = 20;
    scores.lying    = 5;
    return { scores, angles };
  }

  // ── Body is mostly upright (torso < 20° from vertical)
  // Now decide STANDING vs SITTING using hip & knee angles

  const hipA  = angles.hipAngle;
  const kneeA = angles.kneeAngle;

  if (hipA !== undefined && kneeA !== undefined) {
    // Both angles available — most reliable
    // Standing: hipAngle > 150 AND kneeAngle > 150
    // Sitting:  hipAngle < 120  OR  kneeAngle < 130
    const isStanding = hipA > 150 && kneeA > 150;
    const isSitting  = hipA < 120 || kneeA < 130;

    if (isStanding) {
      scores.standing = Math.min(95, Math.round(((hipA-150)/30 + (kneeA-150)/30) * 50 + 60));
      scores.sitting  = 100 - scores.standing;
    } else if (isSitting) {
      const sitConf = Math.round(((180-hipA)/60 + (180-kneeA)/50) * 40 + 40);
      scores.sitting  = Math.min(95, sitConf);
      scores.standing = Math.max(5, 100 - scores.sitting);
    } else {
      // In between — partial sit/stand
      scores.standing = Math.round((hipA - 120) / 60 * 70);
      scores.sitting  = 100 - scores.standing;
    }

  } else if (hipA !== undefined) {
    // Only hip angle
    scores.standing = hipA > 150 ? 75 : hipA > 120 ? 50 : 20;
    scores.sitting  = 100 - scores.standing;

  } else if (kneeA !== undefined) {
    // Only knee angle
    scores.standing = kneeA > 155 ? 75 : kneeA > 130 ? 50 : 20;
    scores.sitting  = 100 - scores.standing;

  } else {
    // No leg joints visible — use aspect ratio heuristic
    if (angles.aspectRatio !== undefined) {
      scores.standing = angles.aspectRatio > 1.4 ? 70 : 50;
      scores.sitting  = 100 - scores.standing;
    } else {
      scores.standing = 55; scores.sitting = 45;
    }
  }

  scores.bending = 0; scores.lying = 0;

  // Clamp
  Object.keys(scores).forEach(k => {
    scores[k] = Math.max(0, Math.min(100, Math.round(scores[k])));
  });

  return { scores, angles };
}

// ── EMA smoother ───────────────────────────────────────
const smooth = { standing:0, sitting:0, lying:0, bending:0 };
function ema(raw) {
  const a = 0.25;
  Object.keys(smooth).forEach(k => {
    smooth[k] = smooth[k]*(1-a) + (raw[k]||0)*a;
  });
  // Normalise to sum = 100
  const total = Object.values(smooth).reduce((s,v)=>s+v,0) || 1;
  const norm = {};
  Object.keys(smooth).forEach(k => { norm[k] = Math.round(smooth[k]/total*100); });
  return norm;
}

// ── Panel update ───────────────────────────────────────
const META = {
  standing: { emoji:'🧍', label:'Standing',  color:'#4ade80' },
  sitting:  { emoji:'🪑', label:'Sitting',   color:'#60a5fa' },
  lying:    { emoji:'🛌', label:'Lying Down', color:'#fbbf24' },
  bending:  { emoji:'🤸', label:'Bending',   color:'#c084fc' },
};

let lastHist='', lastHistT=0, histArr=[];

function updatePanel(norm, angles) {
  const top = Object.entries(norm).sort((a,b)=>b[1]-a[1])[0];
  const [key, val] = top;
  const m = META[key];

  document.getElementById('rt-emoji').textContent  = m.emoji;
  document.getElementById('rt-name').textContent   = m.label;
  document.getElementById('rt-name').style.color   = m.color;
  document.getElementById('rt-conf').textContent   = val + '%';

  // All 4 rows
  const maxVal = Math.max(...Object.values(norm), 1);
  Object.keys(META).forEach(k => {
    const v = norm[k];
    document.getElementById('bar-'+k).style.width = Math.round(v/maxVal*100)+'%';
    document.getElementById('pct-'+k).textContent = v+'%';
    document.getElementById('row-'+k).classList.toggle('winner', k===key);
  });

  // Debug angles
  if (angles.torso !== undefined) {
    document.getElementById('a-torso').textContent = Math.round(angles.torso)+'°';
    document.getElementById('ab-torso').style.width = Math.round(angles.torso/90*100)+'%';
  }
  if (angles.hipAngle !== undefined) {
    document.getElementById('a-hip').textContent = Math.round(angles.hipAngle)+'°';
    document.getElementById('ab-hip').style.width = Math.round(angles.hipAngle/180*100)+'%';
  }
  if (angles.kneeAngle !== undefined) {
    document.getElementById('a-knee').textContent = Math.round(angles.kneeAngle)+'°';
    document.getElementById('ab-knee').style.width = Math.round(angles.kneeAngle/180*100)+'%';
  }
  if (angles.aspectRatio !== undefined) {
    const r = angles.aspectRatio.toFixed(2);
    document.getElementById('a-ratio').textContent = r;
    document.getElementById('ab-ratio').style.width = Math.min(100,Math.round(angles.aspectRatio/2*100))+'%';
  }

  // History
  if (key !== lastHist && val > 55 && Date.now() - lastHistT > 1800) {
    lastHist = key; lastHistT = Date.now();
    const time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    histArr.unshift({ ...m, time });
    if (histArr.length > 12) histArr.pop();
    renderHist();
  }
}

function renderHist() {
  const el = document.getElementById('hist');
  if (!histArr.length) { el.innerHTML='<div class="no-h">No detections yet</div>'; return; }
  el.innerHTML = histArr.map(h=>`
    <div class="h-row">
      <span>${h.emoji}</span>
      <span class="h-name" style="color:${h.color}">${h.label}</span>
      <span class="h-time">${h.time}</span>
    </div>`).join('');
}

// ── Camera ─────────────────────────────────────────────
let camOn=false, poses=[], capture=null, p5inst=null;

function toggleCam() { camOn ? stopCam() : startCam(); }

function startCam() {
  camOn = true; syncBtn();
  document.getElementById('off-screen').style.display='none';
  showLoad('Starting camera…');

  p5inst = new p5(s => {
    s.setup = () => {
      const cnv = s.createCanvas(640, 480);
      cnv.parent('canvas-container');
      capture = s.createCapture(s.VIDEO);
      capture.size(640,480); capture.hide();
      showLoad('Loading PoseNet…');

      const net = ml5.poseNet(capture, {flipHorizontal:false}, () => {
        hideLoad();
        document.getElementById('rt-panel').classList.add('show');
      });
      net.on('pose', r => { poses = r; });
    };

    s.draw = () => {
      // Mirror draw
      s.push(); s.translate(640,0); s.scale(-1,1);
      s.image(capture, 0, 0, 640, 480);
      s.pop();

      if (!poses.length) {
        document.getElementById('rt-emoji').textContent = '👤';
        document.getElementById('rt-name').textContent  = 'No Person';
        document.getElementById('rt-name').style.color  = '#444';
        document.getElementById('rt-conf').textContent  = '—';
        ['standing','sitting','lying','bending'].forEach(k=>{
          document.getElementById('bar-'+k).style.width='0%';
          document.getElementById('pct-'+k).textContent='0%';
          document.getElementById('row-'+k).classList.remove('winner');
        });
        return;
      }

      const pose = poses[0].pose;
      const kpMap = {};
      pose.keypoints.forEach(k => { kpMap[k.part] = k; });
      const mx = x => 640 - x;

      // Skeleton
      s.strokeWeight(2.5); s.noFill();
      LINKS.forEach(([a,b]) => {
        const ka=kpMap[a], kb=kpMap[b];
        if (ka && kb && ka.score>0.3 && kb.score>0.3) {
          s.stroke(74,222,128, Math.min(ka.score,kb.score)*255);
          s.line(mx(ka.position.x),ka.position.y, mx(kb.position.x),kb.position.y);
        }
      });

      // Keypoints
      pose.keypoints.filter(k=>k.score>0.3).forEach(k=>{
        s.noStroke(); s.fill(255,90,130,k.score*255);
        s.circle(mx(k.position.x), k.position.y, 9);
      });

      // Classify + smooth + update
      const { scores, angles } = classify(pose);
      const norm = ema(scores);
      updatePanel(norm, angles);
    };
  });
}

function stopCam() {
  camOn=false; poses=[];
  if (capture){ capture.remove(); capture=null; }
  if (p5inst) { p5inst.remove(); p5inst=null; }
  syncBtn();
  document.getElementById('off-screen').style.display='flex';
  document.getElementById('rt-panel').classList.remove('show');
}

function syncBtn() {
  document.getElementById('cam-btn').className = camOn?'stop':'start';
  document.getElementById('btn-lbl').textContent = camOn?'Disable Camera':'Enable Camera';
}
function showLoad(m){ document.getElementById('load-overlay').classList.add('show'); document.getElementById('load-msg').textContent=m; }
function hideLoad() { document.getElementById('load-overlay').classList.remove('show'); }
</script>
</body>
</html>
