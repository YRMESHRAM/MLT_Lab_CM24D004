<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Export & Re-import Model</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.10.0/tf.min.js"></script>
<style>
  body { font-family: monospace; max-width: 540px; margin: 60px auto; padding: 0 20px; background: #f9f9f9; color: #222; }
  h2   { font-size: 16px; margin-bottom: 4px; }
  p    { font-size: 12px; color: #777; margin-bottom: 20px; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    padding: 10px 20px; border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer; font-family: monospace;
  }
  #btnTrain  { background: #2d6a4f; color: #fff; }
  #btnExport { background: #b5621a; color: #fff; }
  #btnImport { background: #1a3f6b; color: #fff; }
  #btnTrain:hover  { background: #245a41; }
  #btnExport:hover { background: #9a5216; }
  #btnImport:hover { background: #153260; }
  button:disabled  { opacity: 0.4; cursor: not-allowed; }

  /* file input styled as button */
  .file-label {
    padding: 10px 20px; background: #1a3f6b; color: #fff;
    border-radius: 6px; font-size: 13px; cursor: pointer;
    font-family: monospace; display: none;
  }
  .file-label:hover { background: #153260; }
  #fileInput { display: none; }

  pre {
    background: #fff; border: 1px solid #ddd; border-radius: 6px;
    padding: 14px; font-size: 12px; line-height: 1.9;
    margin-top: 18px; white-space: pre-wrap; min-height: 40px;
  }
  .ok     { color: #2d6a4f; font-weight: bold; }
  .err    { color: #c0392b; font-weight: bold; }
  .dim    { color: #aaa; }
  .head   { color: #1a3f6b; font-weight: bold; }
  .match  { background: #eaf4ee; border-radius: 3px; padding: 0 4px; color: #2d6a4f; }
  .nomatch{ background: #fef2f2; border-radius: 3px; padding: 0 4px; color: #c0392b; }
  .warn   { color: #b5621a; }
</style>
</head>
<body>

<h2>Export model to files → Re-import → Test predictions</h2>
<p>Step 1 trains. Step 2 downloads <code>model.json</code> + <code>weights.bin</code>. Step 3 uploads them back and verifies predictions match.</p>

<div class="btn-row">
  <button id="btnTrain"  onclick="trainModel()">▶ Step 1: Train</button>
  <button id="btnExport" onclick="exportModel()" disabled>⬇ Step 2: Export Files</button>

  <!-- shown after export -->
  <label class="file-label" id="importLabel" for="fileInput">⬆ Step 3: Import Files</label>
  <input type="file" id="fileInput" multiple accept=".json,.bin" onchange="importModel(this.files)">
</div>

<pre id="log">Click Step 1 to begin...</pre>

<script>
const log      = document.getElementById('log');
const btnTrain  = document.getElementById('btnTrain');
const btnExport = document.getElementById('btnExport');

let trainedModel  = null;
let originalPreds = {};

function print(msg, cls = '') {
  log.innerHTML += `<span class="${cls}">${msg}</span>\n`;
}

// ── STEP 1: Train ─────────────────────────────────────────
async function trainModel() {
  btnTrain.disabled = true;
  log.innerHTML = '';
  originalPreds = {};

  print('── STEP 1: Train ─────────────────────────', 'head');

  trainedModel = tf.sequential();
  trainedModel.add(tf.layers.dense({ units: 1, inputShape: [1] }));
  trainedModel.compile({ optimizer: 'sgd', loss: 'meanSquaredError' });
  print('Model built ✓');

  // y = 2x + 1
  const xs = tf.tensor2d([-2,-1,0,1,2,3], [6,1]);
  const ys = tf.tensor2d([-3,-1,1,3,5,7], [6,1]);

  await trainedModel.fit(xs, ys, {
    epochs: 150,
    callbacks: {
      onEpochEnd: async (epoch, logs) => {
        if ((epoch+1) % 50 === 0)
          print(`  epoch ${epoch+1}/150  loss: ${logs.loss.toFixed(6)}`, 'dim');
      }
    }
  });
  print('Training done ✓', 'ok');

  // Record original predictions
  print('\nOriginal predictions (y = 2x + 1):');
  for (const x of [0,1,2,3,4,5]) {
    const p = trainedModel.predict(tf.tensor2d([x],[1,1])).dataSync()[0];
    originalPreds[x] = p;
    print(`  x=${x}  →  ${p.toFixed(6)}  (expected ${2*x+1})`, 'dim');
  }

  print('\nStep 1 done. Click Step 2 to export ➜', 'ok');
  btnExport.disabled = false;
  btnTrain.disabled  = false;
}

// ── STEP 2: Export ────────────────────────────────────────
async function exportModel() {
  if (!trainedModel) return;
  btnExport.disabled = true;

  print('\n── STEP 2: Export Files ──────────────────', 'head');
  print('Downloading model.json + weights.bin ...');

  await trainedModel.save('downloads://my-model');

  print('Two files downloaded:', 'ok');
  print('  📄 my-model.json    — architecture + weight manifest');
  print('  📦 my-model.weights.bin — binary weight data');
  print('\nNow click Step 3 and select BOTH files ➜', 'warn');

  document.getElementById('importLabel').style.display = 'block';
  btnExport.disabled = false;
}

// ── STEP 3: Import & Verify ───────────────────────────────
async function importModel(files) {
  if (files.length < 2) {
    print('\nSelect both files: model.json AND weights.bin', 'err');
    return;
  }

  print('\n── STEP 3: Import & Verify ───────────────', 'head');

  // Sort: json first, bin second
  const sorted = Array.from(files).sort((a, b) =>
    a.name.endsWith('.json') ? -1 : 1
  );

  print(`Files selected:`);
  sorted.forEach(f => print(`  📄 ${f.name}  (${(f.size/1024).toFixed(1)} KB)`, 'dim'));

  print('\nLoading model from files...');

  try {
    const reloaded = await tf.loadLayersModel(
      tf.io.browserFiles(sorted)
    );
    print('Model loaded from files ✓', 'ok');

    // Show restored weights
    const [wT, bT] = reloaded.getWeights();
    const w = wT.dataSync()[0];
    const b = bT.dataSync()[0];
    print(`Restored weights → w: ${w.toFixed(6)},  b: ${b.toFixed(6)}`);

    // Verify predictions
    print('\nVerifying predictions:');
    let allMatch = true;

    for (const x of [0,1,2,3,4,5]) {
      const newPred  = reloaded.predict(tf.tensor2d([x],[1,1])).dataSync()[0];
      const origPred = originalPreds[x];
      const diff     = Math.abs(newPred - (origPred ?? newPred));
      const match    = origPred != null ? diff < 1e-4 : true;
      if (!match) allMatch = false;

      const tag = match ? 'match' : 'nomatch';
      const sym = match ? '✓ MATCH' : '✗ DIFF';
      const origStr = origPred != null ? origPred.toFixed(6) : '(no original)';

      print(
        `  x=${x}  orig: ${origStr}` +
        `  imported: ${newPred.toFixed(6)}` +
        `  diff: ${diff.toExponential(1)}  ` +
        `<span class="${tag}">${sym}</span>`
      );
    }

    print('');
    if (allMatch) {
      print('All predictions match — file export/import works ✓', 'ok');
    } else {
      print('Mismatch found — files may not match this session.', 'err');
    }

  } catch (e) {
    print('Import failed: ' + e.message, 'err');
    print('Make sure you selected the correct .json and .bin files.', 'warn');
  }
}
</script>
</body>
</html>
